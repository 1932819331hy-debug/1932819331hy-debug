name: Public metadata probe
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: public-metadata-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == '1932819331hy-debug/1932819331hy-debug'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .probe-state
          key: public-metadata-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            public-metadata-v1-
      - name: Verify probe boundary regressions
        run: python3 -m unittest discover -s .github/metadata-probe -p 'test_*.py' -v
      - name: Check hourly heartbeat and save public metadata cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/metadata-probe/run_cloud_probe.py
      - name: Preserve derived cursors even on a partial source read
        if: always() && hashFiles('.probe-state/**') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .probe-state
          key: public-metadata-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve public handoff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: derived-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .probe-state/latest.json
            .probe-state/events.jsonl
            .probe-state/reviews*.json
            .probe-state/health.json
            .probe-state/health_incidents.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
